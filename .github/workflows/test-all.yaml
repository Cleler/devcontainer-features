name: "CI - Test Features"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - claude
          - claude-code
          - claude-plugin-devcontainer
          - node
        baseImage:
          - ubuntu:jammy
          - debian:12
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
          - mcr.microsoft.com/devcontainers/base:noble
          - mcr.microsoft.com/devcontainers/base:alpine
        exclude:
          # 'claude' depends on the official node feature, which doesn't support Alpine
          - features: claude
            baseImage: mcr.microsoft.com/devcontainers/base:alpine
          - features: claude-plugin-devcontainer
            baseImage: mcr.microsoft.com/devcontainers/base:alpine
          # 'claude' relies on the Dev Containers base images (vscode user): skip the bare ones
          - features: claude
            baseImage: ubuntu:jammy
          - features: claude
            baseImage: debian:12
          - features: claude-plugin-devcontainer
            baseImage: ubuntu:jammy
          - features: claude-plugin-devcontainer
            baseImage: debian:12
    steps:
      - uses: actions/checkout@v4

      - name: "Create the host dir mounted by the 'claude' feature"
        run: mkdir -p ~/.claude/devcontainer

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - claude
          - claude-code
          - claude-plugin-devcontainer
          - node
    steps:
      - uses: actions/checkout@v4

      - name: "Create the host dir mounted by the 'claude' feature"
        run: mkdir -p ~/.claude/devcontainer

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: "Create the host dir mounted by the 'claude' feature"
        run: mkdir -p ~/.claude/devcontainer

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
