name: "CI - Test Features"
on:
  # Weekly (Monday, 05:00 UTC): the PRs are already tested, this catches what comes from outside
  # (new base images, new upstream versions of the tools...)
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      features:
        description: "JSON array of the features to test (all of them by default)"
        required: false
        default: '["claude","claude-code","claude-plugin-devcontainer","docker-outside-of-docker","node"]'

# Same structure as test-pr.yaml, on all the features: each job calls a workflow that runs all its tests
# in parallel and ends with a 'check' job.
jobs:
  test-autogenerated:
    uses: ./.github/workflows/_test-autogenerated.yaml
    with:
      features: ${{ inputs.features || '["claude","claude-code","claude-plugin-devcontainer","docker-outside-of-docker","node"]' }}

  test-scenarios:
    uses: ./.github/workflows/_test-scenarios.yaml
    with:
      features: ${{ inputs.features || '["claude","claude-code","claude-plugin-devcontainer","docker-outside-of-docker","node"]' }}

  test-global:
    uses: ./.github/workflows/_test-global.yaml
