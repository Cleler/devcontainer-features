name: "Test - Scenarios"
on:
  workflow_call:
    inputs:
      features:
        description: "JSON array of the features to test"
        required: true
        type: string

jobs:
  # One entry per scenario of test/<feature>/scenarios.json
  list:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4

      - name: "List the scenarios"
        id: list
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          entries = []
          for feature in json.loads(os.environ["FEATURES"]):
              path = f"test/{feature}/scenarios.json"
              if os.path.exists(path):
                  entries += [{"features": feature, "scenario": s} for s in json.load(open(path))]
          print("scenarios=" + json.dumps(entries))
          PY

  test:
    needs: [list]
    if: needs.list.outputs.scenarios != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Create the host dir mounted by the 'claude' feature"
        run: mkdir -p ~/.claude/devcontainer

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing the '${{ matrix.scenario }}' scenario of '${{ matrix.features }}'"
        run: devcontainer features test -f ${{ matrix.features }} --filter ${{ matrix.scenario }} --skip-autogenerated .

  # Fixed name ('test-scenarios / check'), to require in a ruleset: succeeds only if all the scenarios did
  check:
    needs: [list, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "All the scenarios passed (or there was none to run)"
        env:
          LIST: ${{ needs.list.result }}
          TEST: ${{ needs.test.result }}
        run: '[ "$LIST" = success ] && { [ "$TEST" = success ] || [ "$TEST" = skipped ]; }'
