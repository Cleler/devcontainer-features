name: "CI - Lint and Validate"
on:
  # Only on the PRs: they can't be merged until these checks pass, so there is no need to run them again on main
  pull_request:
  workflow_dispatch:

jobs:
  # Shell scripts of the features (see also 'Manual - Shell Script Linter')
  shellchecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell Linter
        uses: azohra/shell-linter@v0.8.0
        with:
          path: "src/**/*.sh"
          severity: "error" # [style, info, warning, error]
        env:
          SHELLCHECK_OPTS: -e SC2072 # Acceptable use of decimal comparison

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  # If the lint or the validation fails, the other runs of this commit (tests...) are useless: cancel them
  cancel-others:
    needs: [shellchecker, validate]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: "Cancel the other runs of this commit"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for id in $(gh run list --repo "${GITHUB_REPOSITORY}" --commit "${SHA}" --json databaseId,status -q '.[] | select(.status != "completed") | .databaseId'); do
            if [ "${id}" != "${GITHUB_RUN_ID}" ]; then
              echo "Cancelling run ${id}"
              gh run cancel "${id}" --repo "${GITHUB_REPOSITORY}" || true
            fi
          done
