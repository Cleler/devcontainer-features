name: "Manual - Test Features"
on:
  workflow_dispatch:
    inputs:
      features:
        description: "Feature to execute the tests against (claude, claude-code, claude-plugin-devcontainer, node)"
        required: true
        default: "node"
      baseImage:
        description: "Base image"
        required: true
        default: "mcr.microsoft.com/devcontainers/base:alpine"
      logLevel:
        description: "Log Level (info/debug/trace)"
        required: true
        default: "info"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Create the host dir mounted by the 'claude' feature"
        run: mkdir -p ~/.claude/devcontainer

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ github.event.inputs.features }}' against '${{ github.event.inputs.baseImage }}'"
        # Inputs go through env variables, not straight into the script
        env:
          FEATURES: ${{ github.event.inputs.features }}
          BASE_IMAGE: ${{ github.event.inputs.baseImage }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel }}
        run: devcontainer features test --skip-scenarios --features "$FEATURES" --base-image "$BASE_IMAGE" --log-level "$LOG_LEVEL" .
