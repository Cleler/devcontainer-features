name: "Test - Global scenarios"
on:
  workflow_call:
    inputs:
      enabled:
        description: "false: the tests are skipped (the check job still succeeds)"
        type: boolean
        default: true

jobs:
  # One entry per scenario of test/_global/scenarios.json
  list:
    if: inputs.enabled
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4

      - name: "List the global scenarios"
        id: list
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("scenarios=" + json.dumps(list(json.load(open("test/_global/scenarios.json")))))
          PY

  test:
    needs: [list]
    if: inputs.enabled
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.list.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Create the host dir mounted by the 'claude' feature"
        run: mkdir -p ~/.claude/devcontainer

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing the global scenario '${{ matrix.scenario }}'"
        run: devcontainer features test --global-scenarios-only --filter ${{ matrix.scenario }} .

  # Fixed name ('test-global / check'), to require in a ruleset: succeeds only if all the scenarios did
  check:
    needs: [list, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "All the global scenarios passed (or they were skipped: nothing to test)"
        env:
          ENABLED: ${{ inputs.enabled }}
          LIST: ${{ needs.list.result }}
          TEST: ${{ needs.test.result }}
        run: '[ "${ENABLED}" != true ] || { [ "${LIST}" = success ] && [ "${TEST}" = success ]; }'
