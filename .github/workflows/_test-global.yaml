name: "Test - Global scenarios"
on:
  workflow_call:
    inputs:
      features:
        description: "JSON array of the changed features: only the scenarios using at least one of them are run. 'all': every scenario."
        type: string
        default: all

jobs:
  # One entry per scenario of test/_global/scenarios.json that uses one of the features
  list:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4

      - name: "List the global scenarios"
        id: list
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          wanted = os.environ["FEATURES"]
          scenarios = json.load(open("test/_global/scenarios.json"))
          if wanted != "all":
              features = set(json.loads(wanted))
              # the keys of "features" are the ids of the local features (or registry references)
              scenarios = {name: s for name, s in scenarios.items() if features & set(s["features"])}
          print("scenarios=" + json.dumps(list(scenarios)))
          PY

  test:
    needs: [list]
    if: needs.list.outputs.scenarios != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.list.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Create the host dir mounted by the 'claude' feature"
        run: mkdir -p ~/.claude/devcontainer

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing the global scenario '${{ matrix.scenario }}'"
        run: devcontainer features test --global-scenarios-only --filter ${{ matrix.scenario }} .

  # Fixed name ('test-global / check'), to require in a ruleset: succeeds only if all the scenarios did
  check:
    needs: [list, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "All the global scenarios passed (or there was none to run)"
        env:
          LIST: ${{ needs.list.result }}
          TEST: ${{ needs.test.result }}
        run: '[ "${LIST}" = success ] && { [ "${TEST}" = success ] || [ "${TEST}" = skipped ]; }'
