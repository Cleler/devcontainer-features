name: "PR - Test Updated Features"
on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.filter.outputs.changes }}
      global: ${{ steps.global.outputs.global }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A file counts if it is in the feature (or its tests) AND it is neither a README nor a NOTES:
          # changing only the documentation doesn't need any test
          predicate-quantifier: every
          filters: |
            claude:
              - './**/claude/**'
              - '!**/README.md'
              - '!**/NOTES.md'
            claude-code:
              - './**/claude-code/**'
              - '!**/README.md'
              - '!**/NOTES.md'
            claude-plugin-devcontainer:
              - './**/claude-plugin-devcontainer/**'
              - '!**/README.md'
              - '!**/NOTES.md'
            docker-outside-of-docker:
              - './**/docker-outside-of-docker/**'
              - '!**/README.md'
              - '!**/NOTES.md'
            node:
              - './**/node/**'
              - '!**/README.md'
              - '!**/NOTES.md'
            shell-history:
              - './**/shell-history/**'
              - '!**/README.md'
              - '!**/NOTES.md'

      # The global scenarios themselves
      - uses: dorny/paths-filter@v4
        id: global
        with:
          filters: |
            global: test/_global/**

  # Each of the next jobs calls a workflow that runs all its tests in parallel and ends with a 'check' job
  # (test-autogenerated / check, ...): a fixed name that exists on every PR, to require in a ruleset.
  # Without any changed feature, the sub workflows just skip their tests.
  test-autogenerated:
    needs: [detect-changes]
    uses: ./.github/workflows/_test-autogenerated.yaml
    with:
      features: ${{ needs.detect-changes.outputs.features }}

  test-scenarios:
    needs: [detect-changes]
    uses: ./.github/workflows/_test-scenarios.yaml
    with:
      features: ${{ needs.detect-changes.outputs.features }}

  # Global scenarios combine several features: only the ones using a changed feature run (all of them if a global
  # scenario itself changed). The called workflow is always there, for its 'check' job.
  test-global:
    needs: [detect-changes]
    uses: ./.github/workflows/_test-global.yaml
    with:
      features: ${{ needs.detect-changes.outputs.global == 'true' && 'all' || needs.detect-changes.outputs.features }}
