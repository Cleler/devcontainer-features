name: "PR - Test Updated Features"
on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            claude: ./**/claude/**
            claude-code: ./**/claude-code/**
            claude-plugin-devcontainer: ./**/claude-plugin-devcontainer/**
            node: ./**/node/**

  # Each of the next jobs calls a workflow (in _test/) that runs all its tests in parallel,
  # and ends with their result.
  test-autogenerated:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    uses: ./.github/workflows/_test-autogenerated.yaml
    with:
      features: ${{ needs.detect-changes.outputs.features }}

  test-scenarios:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    uses: ./.github/workflows/_test-scenarios.yaml
    with:
      features: ${{ needs.detect-changes.outputs.features }}

  # Global scenarios combine several features: always run them
  test-global:
    uses: ./.github/workflows/_test-global.yaml

  # One check per sub workflow, with a fixed name that exists on every PR (the checks of the sub workflows
  # are named after their inner jobs and depend on the PR): it succeeds only if all the tests of the sub
  # workflow succeeded, or if the sub workflow was skipped because no feature changed.
  check-autogenerated:
    needs: [test-autogenerated]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "All the autogenerated tests passed (or were skipped)"
        env:
          RESULT: ${{ needs.test-autogenerated.result }}
        run: '[ "$RESULT" = success ] || [ "$RESULT" = skipped ]'

  check-scenarios:
    needs: [test-scenarios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "All the scenarios passed (or were skipped)"
        env:
          RESULT: ${{ needs.test-scenarios.result }}
        run: '[ "$RESULT" = success ] || [ "$RESULT" = skipped ]'

  check-global:
    needs: [test-global]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "All the global scenarios passed"
        env:
          RESULT: ${{ needs.test-global.result }}
        run: '[ "$RESULT" = success ]'
