name: "Test - Autogenerated"
on:
  workflow_call:
    inputs:
      features:
        description: "JSON array of the features to test"
        required: true
        type: string

jobs:
  test:
    if: inputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(inputs.features) }}
        baseImage:
          - ubuntu:jammy
          - debian:12
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
          - mcr.microsoft.com/devcontainers/base:noble
          - mcr.microsoft.com/devcontainers/base:alpine
          - mcr.microsoft.com/devcontainers/base:alpine-3.22
        exclude:
          # 'claude' relies on the Dev Containers base images (vscode user): skip the bare ones
          - features: claude
            baseImage: ubuntu:jammy
          - features: claude
            baseImage: debian:12
          - features: claude-plugin-devcontainer
            baseImage: ubuntu:jammy
          - features: claude-plugin-devcontainer
            baseImage: debian:12
    steps:
      - uses: actions/checkout@v4

      - name: "Create the host dir mounted by the 'claude' feature"
        run: mkdir -p ~/.claude/devcontainer

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  # Fixed name ('test-autogenerated / check'), to require in a ruleset: succeeds only if all the tests did
  check:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "All the autogenerated tests passed (or were skipped: no feature changed)"
        env:
          RESULT: ${{ needs.test.result }}
        run: '[ "$RESULT" = success ] || [ "$RESULT" = skipped ]'
